worker_processes 1;
worker_rlimit_nofile 1048576;
worker_cpu_affinity 0010; # isolate to core 1

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    client_max_body_size 4M;
    large_client_header_buffers 64 8k;

    upstream backend {
        server 127.0.0.1:8095;
        keepalive 1024; # reuse 1024 connections
    }

    # simple routing
    server {
        listen 8085;
        server_name bench.local;

        location / {
            if ($request_method != POST) { return 405; }
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # deep headers
    server {
        listen 8086;
        server_name bench.local;
        location / {
            if ($request_method != POST) { return 405; }
            if ($http_x_bench_hdr_1 != "bench-hdr-val-1") { return 403; }
            if ($http_x_bench_hdr_2 != "bench-hdr-val-2") { return 403; }
            if ($http_x_bench_hdr_3 != "bench-hdr-val-3") { return 403; }
            if ($http_x_bench_hdr_4 != "bench-hdr-val-4") { return 403; }
            if ($http_x_bench_hdr_5 != "bench-hdr-val-5") { return 403; }
            if ($http_x_bench_hdr_6 != "bench-hdr-val-6") { return 403; }
            if ($http_x_bench_hdr_7 != "bench-hdr-val-7") { return 403; }
            if ($http_x_bench_hdr_8 != "bench-hdr-val-8") { return 403; }
            if ($http_x_bench_hdr_9 != "bench-hdr-val-9") { return 403; }
            if ($http_x_bench_hdr_10 != "bench-hdr-val-10") { return 403; }
            if ($http_x_bench_hdr_11 != "bench-hdr-val-11") { return 403; }
            if ($http_x_bench_hdr_12 != "bench-hdr-val-12") { return 403; }
            if ($http_x_bench_hdr_13 != "bench-hdr-val-13") { return 403; }
            if ($http_x_bench_hdr_14 != "bench-hdr-val-14") { return 403; }
            if ($http_x_bench_hdr_15 != "bench-hdr-val-15") { return 403; }
            if ($http_x_bench_hdr_16 != "bench-hdr-val-16") { return 403; }
            if ($http_x_bench_hdr_17 != "bench-hdr-val-17") { return 403; }
            if ($http_x_bench_hdr_18 != "bench-hdr-val-18") { return 403; }
            if ($http_x_bench_hdr_19 != "bench-hdr-val-19") { return 403; }
            if ($http_x_bench_hdr_20 != "bench-hdr-val-20") { return 403; }
            if ($http_x_bench_hdr_21 != "bench-hdr-val-21") { return 403; }
            if ($http_x_bench_hdr_22 != "bench-hdr-val-22") { return 403; }
            if ($http_x_bench_hdr_23 != "bench-hdr-val-23") { return 403; }
            if ($http_x_bench_hdr_24 != "bench-hdr-val-24") { return 403; }
            if ($http_x_bench_hdr_25 != "bench-hdr-val-25") { return 403; }
            if ($http_x_bench_hdr_26 != "bench-hdr-val-26") { return 403; }
            if ($http_x_bench_hdr_27 != "bench-hdr-val-27") { return 403; }
            if ($http_x_bench_hdr_28 != "bench-hdr-val-28") { return 403; }
            if ($http_x_bench_hdr_29 != "bench-hdr-val-29") { return 403; }
            if ($http_x_bench_hdr_30 != "bench-hdr-val-30") { return 403; }
            if ($http_x_bench_hdr_31 != "bench-hdr-val-31") { return 403; }
            if ($http_x_bench_hdr_32 != "bench-hdr-val-32") { return 403; }

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
