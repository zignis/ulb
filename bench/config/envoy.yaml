admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
static_resources:
  listeners:
  # simple routing
  - name: simple_routing
    per_connection_buffer_limit_bytes: 4194304 # 4MiB
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8085
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          common_http_protocol_options:
            max_headers_count: 256
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["bench.local"]
              routes:
              - match:
                  prefix: "/"
                  headers:
                  - name: ":method"
                    string_match:
                      exact: "POST"
                route:
                  cluster: backend_cluster
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  
  # deep headers
  - name: deep_headers
    per_connection_buffer_limit_bytes: 4194304 # 4MiB
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8086
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http_deep
          common_http_protocol_options:
            max_headers_count: 256
          route_config:
            name: deep_route
            virtual_hosts:
            - name: backend
              domains: ["bench.local"]
              routes:
              - match:
                  prefix: "/"
                  headers:
                  - name: ":method"
                    string_match:
                      exact: "POST"
                  - name: x-bench-hdr-1
                    string_match:
                      exact: "bench-hdr-val-1"
                  - name: x-bench-hdr-2
