global
    nbthread 1 # single thread
    cpu-map 1/1 1
    tune.http.maxhdr 256
    maxconn 65535

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

    # disable splicing
    no option splice-auto
    no option splice-request
    no option splice-response

frontend simple_routing
    bind 0.0.0.0:8085 backlog 65536
    acl host_bench hdr(host) bench.local
    http-request deny if !host_bench
    acl is_post method POST
    http-request deny if !is_post
    default_backend backend_server

frontend deep_headers
    bind 0.0.0.0:8086 backlog 65536
    acl host_bench hdr(host) bench.local
    http-request deny if !host_bench
    acl is_post method POST
    http-request deny if !is_post
    
    acl test1 hdr(x-bench-hdr-1) bench-hdr-val-1
    acl test2 hdr(x-bench-hdr-2) bench-hdr-val-2
    acl test3 hdr(x-bench-hdr-3) bench-hdr-val-3
